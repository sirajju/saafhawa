name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GEMINI_MODELS: gemini-flash-lite-latest,gemini-2.5-flash-lite,gemini-3.8-flash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Checks (Lint, Typecheck, Test, Format)
        run: npm run check

      - name: Install Playwright Chromium & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application (Standalone)
        run: npm run build

      - name: Run End-to-End Smoke Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
